name: book-rag

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached            # repository from the host (D:\dev\...) bind-mount
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      # Secrets are injected from .devcontainer/.env (gitignored) or from the host env.
      # ":-" — empty default value so compose doesn't fail when the variable is missing.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      UV_PROJECT_ENVIRONMENT: /opt/venv
    command: sleep infinity            # container stays alive, VS Code attaches into it
    depends_on:
      db:
        condition: service_healthy

  db:
    # ParadeDB = PostgreSQL + pg_search (BM25) + pgvector. dev = prod (k8s with pg_search).
    # Pinned by digest (verified): PostgreSQL 18.4, pgvector 0.8.2, pg_search 0.24.0, ltree 1.3.
    # In prod (k8s) deploy THE SAME versions so dev = prod.
    image: paradedb/paradedb@sha256:dbd64f0eb2716b8466afe54b91fec782f4107a8d0e6bd3660b89c88a1ded2ead
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # host:container. 5432 on the host is taken by another project (t_postgres) — use 55432.
      # Inside the devcontainer the app still reaches the DB over the compose network as db:5432.
      - "55432:5432"                   # forward to the host (optional, for psql from Windows)
    volumes:
      # PG18+ stores data in /var/lib/postgresql/<ver>/docker — mount the PARENT,
      # not .../data (otherwise the image fails with exit 1: "unused mount/volume").
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
