# Shared `db` package: schema (DDL) + connection + models + the contract dimension constant.
# Core QUERIES do NOT live here (ingest writes, rag reads).
[project]
name = "db"
version = "0.0.0"
description = "Shared DB package: schema, connection, models, dimension constant"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db"]
