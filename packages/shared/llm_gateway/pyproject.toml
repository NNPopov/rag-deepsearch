# Shared `llm_gateway` package: LiteLLM wrapper (completion + embedding), config-agnostic.
[project]
name = "llm_gateway"
version = "0.0.0"
description = "Shared LLM gateway (LiteLLM wrapper): completion + embedding"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]
