# TRANSPORT package (part 3): thin adapters over the web-free `rag` core.
# Web dependencies (fastapi/uvicorn/sse-starlette[/a2a-sdk]) are confined HERE — they leak neither into `rag`
# nor into `ingest` (Rag_query_architecture.md §7, fork 1). Depends only on `rag` by name
# (uv workspace); the core knows nothing about transport. ADR-0002: the core is natively async, so the
# endpoints await it directly (await run(...) / async for over stream(...)) — no thread-pool bridge.
[project]
name = "serve"
version = "0.0.0"
description = "RAG transport: FastAPI REST + SSE (and A2A) adapters over the rag deep-search core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.1",
    "a2a-sdk==1.1.0",                  # A2A (Q14): Agent Card + message/stream, confined to a2a.py;
                                       # VERSION IS PINNED (§7: SDK drift risk isolated by the adapter)
    "rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serve"]

[tool.uv.sources]
rag = { workspace = true }
