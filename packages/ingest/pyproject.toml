# INGESTION app package (filling the DB): extract → structure → chunk → embed → persist.
# Depends on the shared llm_gateway and db by name (uv workspace).
# pdfminer.six added at S7 (Extract method); chonkie+tiktoken — at S10 (Chunk).
# chonkie[…] WITHOUT semantic/torch: RecursiveChunker + tiktoken (cl100k) — pure CPU, no torch.
[project]
name = "ingest"
version = "0.0.0"
description = "RAG ingestion app: pipes-and-filters pipeline filling the DB"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "dynaconf>=3.2",
    "pdfminer.six>=20240706",
    "chonkie>=1.0",
    "tiktoken>=0.7",
    "db",
    "llm_gateway",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.uv.sources]
db = { workspace = true }
llm_gateway = { workspace = true }
